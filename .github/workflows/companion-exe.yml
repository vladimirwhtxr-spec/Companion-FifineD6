name: Build Companion D6 Windows tray app
on:
  push:
    branches: ['build/companion-exe-20260928']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -v
      - run: python -m PyInstaller --noconfirm --clean companion.spec
      - run: python verify_packaged.py
      - shell: pwsh
        run: |
          Copy-Item README_RU.md,README_EN.md,LICENSE,config.example.json dist/D6Companion/
          Remove-Item dist/D6Companion/*.log -ErrorAction SilentlyContinue
          Get-FileHash dist/D6Companion/*.exe -Algorithm SHA256 | Format-List | Out-File dist/D6Companion/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D6Companion-Windows-x64
          path: dist/D6Companion/
          if-no-files-found: error
          retention-days: 30
