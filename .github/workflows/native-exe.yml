name: Build native D6 Windows executable
on:
  push:
    branches: ['build/native-exe-20260928']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exe:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install runtime and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Protocol tests
        run: python -m unittest discover -v
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --console --noupx --hidden-import hid --name D6NativeBridge app.py
      - name: Exercise packaged executable on Windows
        shell: pwsh
        run: |
          & .\dist\D6NativeBridge.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged self-test failed' }
          & .\dist\D6NativeBridge.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed' }
          Copy-Item README_EXE_RU.txt dist\
          Copy-Item README_RU.md dist\
          Copy-Item LICENSE dist\
          Get-FileHash dist\D6NativeBridge.exe -Algorithm SHA256 | Format-List | Out-File dist\SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D6NativeBridge-Windows-x64-experimental
          path: native/dist/
          if-no-files-found: error
          retention-days: 30
